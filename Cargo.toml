[package]
name = "chromium"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
serde_json = "1.0.154"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "derive",
    "uuid",
    "sqlite",
    "postgres",
    "chrono"

] }
tokio = {version = "1.54.1", features=["full"]}
utc = "0.2.0"
uuid = {version = "1.23.4", features = ["v4", "serde"] }

